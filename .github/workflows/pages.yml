name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard published tree
        run: |
          test -f index.html
          if [ -e DESIGN.md ]; then
            echo "DESIGN.md must not be published" >&2
            exit 1
          fi
          if grep -RniE 'dowfrost|nvidia|strata|bundy|kaiser|houghton|nvl72|gb300|z-93|3003|6061|daedalus|zeus' --exclude-dir=.git --exclude-dir=.github .; then
            echo "branded strings in public tree" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
